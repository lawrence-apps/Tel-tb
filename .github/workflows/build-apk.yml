name: Build TV APK

on:
  workflow_dispatch:
    inputs:
      cfg:
        description: "base64 JSON config (private)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read config
        run: |
          CFG=$(jq -r '.inputs.cfg' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$CFG"
          echo "$CFG" | base64 -d > /tmp/cfg.json
          for k in api_hash bot_token ks_pass; do v=$(jq -r ".$k" /tmp/cfg.json); echo "::add-mask::$v"; done
          jq -r .ks /tmp/cfg.json | base64 -d > /tmp/release.p12
          {
            echo "TG_HASH=$(jq -r .api_hash /tmp/cfg.json)"
            echo "TG_TOKEN=$(jq -r .bot_token /tmp/cfg.json)"
            echo "KS_PASS=$(jq -r .ks_pass /tmp/cfg.json)"
            echo "VCODE=$(jq -r .version_code /tmp/cfg.json)"
            echo "VNAME=$(jq -r .version_name /tmp/cfg.json)"
          } >> "$GITHUB_ENV"
          rm /tmp/cfg.json

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: tv-app
        run: |
          gradle --no-daemon assembleRelease -PtgApiHash="$TG_HASH" -PtgBotToken="$TG_TOKEN" \
            -PksFile=/tmp/release.p12 -PksPass="$KS_PASS" -PksAlias=tgtv \
            -PversionCode="$VCODE" -PversionName="$VNAME"

      - name: Rename APK
        run: cp tv-app/app/build/outputs/apk/release/app-release.apk TelegramTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TelegramTV-apk
          path: TelegramTV.apk
          retention-days: 3

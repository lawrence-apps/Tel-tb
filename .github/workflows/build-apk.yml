name: Build TV APK

on:
  workflow_dispatch:
    inputs:
      cfg:
        description: "base64 JSON config (optional — khali chhodo to repo secrets use honge)"
        required: false
        default: ""
      version_code:
        description: "versionCode (optional, default 12)"
        required: false
        default: ""
      version_name:
        description: "versionName (optional, default 2.2)"
        required: false
        default: ""

# Release publish ke liye GITHUB_TOKEN ko likhne ki permission chahiye
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve config
        env:
          CFG: ${{ github.event.inputs.cfg }}
          IN_VCODE: ${{ github.event.inputs.version_code }}
          IN_VNAME: ${{ github.event.inputs.version_name }}
          S_API_HASH: ${{ secrets.TG_API_HASH }}
          S_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          S_KS_B64: ${{ secrets.TV_KS_B64 }}
          S_KS_PASS: ${{ secrets.TV_KS_PASS }}
        run: |
          if [ -n "$CFG" ]; then
            # Purana tareeka: poora config base64 JSON input se
            echo "::add-mask::$CFG"
            echo "$CFG" | base64 -d > /tmp/cfg.json
            for k in api_hash bot_token ks_pass; do v=$(jq -r ".$k // empty" /tmp/cfg.json); [ -n "$v" ] && echo "::add-mask::$v"; done
            TG_HASH=$(jq -r '.api_hash // empty' /tmp/cfg.json)
            TG_TOKEN=$(jq -r '.bot_token // empty' /tmp/cfg.json)
            KS_PASS=$(jq -r '.ks_pass // empty' /tmp/cfg.json)
            VCODE=$(jq -r '.version_code // empty' /tmp/cfg.json)
            VNAME=$(jq -r '.version_name // empty' /tmp/cfg.json)
            jq -r '.ks // empty' /tmp/cfg.json | base64 -d > /tmp/release.p12 || true
            rm /tmp/cfg.json
          else
            # Naya tareeka: repo secrets se (build khud-chala, koi input nahi chahiye)
            [ -n "$S_API_HASH" ] && echo "::add-mask::$S_API_HASH"
            [ -n "$S_BOT_TOKEN" ] && echo "::add-mask::$S_BOT_TOKEN"
            [ -n "$S_KS_PASS" ] && echo "::add-mask::$S_KS_PASS"
            TG_HASH="$S_API_HASH"
            TG_TOKEN="$S_BOT_TOKEN"
            KS_PASS="$S_KS_PASS"
            VCODE="${IN_VCODE:-12}"
            VNAME="${IN_VNAME:-2.2}"
            if [ -n "$S_KS_B64" ]; then echo "$S_KS_B64" | base64 -d > /tmp/release.p12; else rm -f /tmp/release.p12; fi
          fi
          # NOTE: $GITHUB_ENV agle step se active hota hai, isliye yahin local vars se check karo
          if [ -z "$TG_HASH" ] || [ -z "$TG_TOKEN" ]; then
            echo "TG_API_HASH / TG_BOT_TOKEN secrets nahi mile (na input na secrets). Repo Settings > Secrets and variables > Actions me daalo."
            exit 1
          fi
          {
            echo "TG_HASH=$TG_HASH"
            echo "TG_TOKEN=$TG_TOKEN"
            echo "KS_PASS=$KS_PASS"
            echo "VCODE=$VCODE"
            echo "VNAME=$VNAME"
          } >> "$GITHUB_ENV"
          if [ -s /tmp/release.p12 ]; then echo "HAS_KS=true" >> "$GITHUB_ENV"; else echo "HAS_KS=false" >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: tv-app
        run: |
          ARGS="-PtgApiHash=$TG_HASH -PtgBotToken=$TG_TOKEN -PversionCode=${VCODE:-11} -PversionName=${VNAME:-2.1}"
          if [ "$HAS_KS" = "true" ] && [ -n "$KS_PASS" ]; then
            ARGS="$ARGS -PksFile=/tmp/release.p12 -PksPass=$KS_PASS -PksAlias=tgtv"
          else
            echo "Keystore secret (TV_KS_B64 / TV_KS_PASS) nahi mila — debug key se sign hoga."
          fi
          gradle --no-daemon assembleRelease $ARGS

      - name: Rename APK
        run: cp tv-app/app/build/outputs/apk/release/app-release.apk "RC-TV-v${VNAME:-2.1}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TelegramTV-apk
          path: RC-TV-v*.apk
          retention-days: 7

      - name: GitHub Release publish (automatic)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${VNAME:-2.1}"; VC="${VCODE:-11}"
          APK="RC-TV-v${V}.apk"; TAG="v${V}"
          [ -f "$APK" ] || { echo "APK nahi mila: $APK"; exit 1; }
          # Isi version ka purana release/tag hata do taaki hamesha latest build hi release me rahe
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          NOTES=$(cat <<EOB
          RC TV v${V} (versionCode ${VC}) — build se auto-publish hua APK.

          **Install:** APK download karo → TV me file manager se kholo → "Unknown sources" allow karo → install.
          App khud bhi update popup dikhayega jab storage channel me TGTV-UPDATE post aayega.

          **Is build me:** pura changelog repo ki commit history me hai (https://github.com/${GITHUB_REPOSITORY}/commits/main).
          EOB
          )
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "RC TV v${V}" --notes "$NOTES"
          # Naya update aaya = PURANE releases/tags sab hata do (sirf latest rahe)
          for t in $(gh release list --limit 50 --json tagName --jq '.[].tagName'); do
            if [ "$t" != "$TAG" ]; then echo "purana release hatao: $t"; gh release delete "$t" --yes --cleanup-tag || true; fi
          done
          echo "Release publish ho gaya: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: APK storage channel me post + admin copy (automatic)
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: "-1003904890252"
          TG_ADMIN_ID: "1345802943"
        run: |
          V="${VNAME:-2.1}"; VC="${VCODE:-11}"
          APK="RC-TV-v${V}.apk"
          # 1) Storage channel me seedha post — update release, koi manual forward nahi
          echo "Post kar rahe hain: $APK -> storage channel $TG_CHANNEL_ID"
          CAP=$(printf 'TGTV-UPDATE %s %s\nRC TV v%s (versionCode %s) — naya update. App popup se install kar lo.' "$VC" "$V" "$V" "$VC")
          C1=$(curl -sS --max-time 600 -o /tmp/tgch.json -w "%{http_code}" \
            -F "chat_id=${TG_CHANNEL_ID}" \
            -F "document=@${APK}" \
            -F "caption=${CAP}" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument")
          jq -e '.ok == true' /tmp/tgch.json >/dev/null || { cat /tmp/tgch.json; echo "channel post FAIL (http $C1)"; exit 1; }
          MSGID=$(jq -r '.result.message_id' /tmp/tgch.json)
          echo "Channel me post ho gaya (message_id ${MSGID}) — update live, sab TV par popup aayega"
          # 2) Admin ko info + backup copy
          CAP2=$(printf 'RC TV v%s (versionCode %s) build ready.\nStorage channel me khud post ho gaya (message %s) — update release ho chuka hai.\nYe DM backup copy hai.' "$V" "$VC" "$MSGID")
          C2=$(curl -sS --max-time 600 -o /tmp/tgadm.json -w "%{http_code}" \
            -F "chat_id=${TG_ADMIN_ID}" \
            -F "document=@${APK}" \
            -F "caption=${CAP2}" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument")
          jq -e '.ok == true' /tmp/tgadm.json >/dev/null || { cat /tmp/tgadm.json; echo "admin DM FAIL (http $C2)"; exit 1; }
          DMID=$(jq -r '.result.message_id' /tmp/tgadm.json)
          echo "Admin ko backup copy bhi chali gayi (message_id ${DMID})"
          echo "NEW_CH_MSG=${MSGID}" >> "$GITHUB_ENV"
          echo "NEW_DM_MSG=${DMID}" >> "$GITHUB_ENV"

      - name: Purane updates hatao (channel + bot DM)
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: "-1003904890252"
          TG_ADMIN_ID: "1345802943"
        run: |
          # Pichhli baar ke post/DM ki id .github/update-state.json me rakhi hoti hai
          # (bots history search nahi kar sakte, isliye id yaad rakhni padti hai)
          OLD_CH=0; OLD_DM=0
          if [ -f .github/update-state.json ]; then
            OLD_CH=$(jq -r '.channel_msg // 0' .github/update-state.json)
            OLD_DM=$(jq -r '.dm_msg // 0' .github/update-state.json)
          fi
          delmsg () {
            curl -sS --max-time 60 "https://api.telegram.org/bot${TG_TOKEN}/deleteMessage" \
              -d "chat_id=$1" -d "message_id=$2" > /tmp/del.json || true
            jq -e '.ok == true' /tmp/del.json >/dev/null 2>&1 && echo "purana update hata (chat $1, msg $2)" || echo "msg $2 delete nahi hua (chalega)"
          }
          if [ "${OLD_CH:-0}" != "0" ] && [ "${OLD_CH}" != "${NEW_CH_MSG:-0}" ]; then delmsg "$TG_CHANNEL_ID" "$OLD_CH"; fi
          if [ "${OLD_DM:-0}" != "0" ] && [ "${OLD_DM}" != "${NEW_DM_MSG:-0}" ]; then delmsg "$TG_ADMIN_ID" "$OLD_DM"; fi
          # naya state likho aur repo me save kar do (fail hua to build nahi rukega)
          jq -n --arg c "${NEW_CH_MSG:-0}" --arg d "${NEW_DM_MSG:-0}" '{channel_msg: ($c|tonumber), dm_msg: ($d|tonumber)}' > .github/update-state.json
          git config user.name "rgtv-bot"; git config user.email "bot@rgtv.local"
          git add .github/update-state.json
          git commit -m "update-state: channel msg ${NEW_CH_MSG:-?}, DM msg ${NEW_DM_MSG:-?} [skip ci]" || true
          git pull --rebase -q origin main || true
          git push -q origin main || echo "state push fail (chalega — agli baar phir try hoga)"
